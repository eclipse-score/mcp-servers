[project]
name = "score-mcp-server"
version = "0.1.0"
description = "MCP servers for Eclipse S-CORE - exposes build/test/lint tooling to AI coding agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
]

[project.scripts]
score-mcp-server = "score_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "basedpyright>=1.10",
  "pre-commit>=3.8",
]
