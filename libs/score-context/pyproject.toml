[project]
name = "score-context"
version = "0.1.0"
description = "MCP-free context schema and delta models for Eclipse S-CORE"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_context"]
