# Reports when the docs-as-code metamodel no longer matches metamodel-flow.
# Opens or updates an issue; the refresh itself is a normal reviewed PR.
name: Metamodel drift

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metamodel-drift
  cancel-in-progress: false

jobs:
  check:
    name: Check docs-as-code metamodel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync workspace
        run: uv sync
      - name: Check for drift
        id: drift
        run: |
          set +e
          uv run python packages/metamodel-flow/src/refresh_model.py --ref main --check > drift.md
          status=$?
          set -e
          cat drift.md
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          test "${status}" -le 1
      - name: Open or update issue
        if: steps.drift.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "metamodel-flow: docs-as-code metamodel changed"
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --repo "$GITHUB_REPOSITORY" --body-file drift.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${TITLE}" --body-file drift.md
          fi
