name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Detect new version
        id: version
        run: |
          version="$(python3 scripts/prepare_release.py --current)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} exists, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        if: steps.version.outputs.new == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Update pins to release commit
        if: steps.version.outputs.new == 'true'
        run: |
          # Automatically update pins to point to the merge commit
          python3 scripts/prepare_release.py "${{ steps.version.outputs.version }}"
      - name: Check pins against release commit
        if: steps.version.outputs.new == 'true'
        run: python3 scripts/check_pins.py --release
      - name: Test
        if: steps.version.outputs.new == 'true'
        run: |
          uv sync
          uv run pytest
      - name: Commit pin updates back to main
        if: steps.version.outputs.new == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: update pins for release ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
      - name: Create tag and GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes

  features:
    name: Publish devcontainer features
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish features to GHCR
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./features/src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
