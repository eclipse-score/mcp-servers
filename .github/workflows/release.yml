name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  features:
    name: Publish devcontainer features
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish features to GHCR (rolling release)
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./features/src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
