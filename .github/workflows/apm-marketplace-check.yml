name: APM Marketplace Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - local_harness_apm
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  marketplace-check:
    name: Check APM marketplace packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check package Markdown hygiene
        run: python scripts/check_markdown_hygiene.py --root . --include packages

      - name: Install APM CLI
        run: python -m pip install --upgrade apm-cli

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Generate marketplace artifact
        run: apm pack

      - name: Check marketplace packages
        run: apm marketplace check

      - name: Test remote marketplace MCP servers
        env:
          MCP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          apm marketplace add https://github.com/eclipse-score/mcp-servers \
            --name eclipse-score-apm-marketplace --ref "$MCP_REF"
          apm install context-discipline@eclipse-score-apm-marketplace \
            --target copilot --trust-transitive-mcp
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(".vscode/mcp.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          revision = os.environ["MCP_REF"]
          for server in config["servers"].values():
              args = server.get("args", [])
              for index, argument in enumerate(args):
                  if argument.startswith("git+https://github.com/eclipse-score/mcp-servers#"):
                      args[index] = argument.replace(
                          "git+https://github.com/eclipse-score/mcp-servers#",
                          f"git+https://github.com/eclipse-score/mcp-servers@{revision}#",
                          1,
                      )
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          uv tool install 'graphifyy[mcp]'
          python "$GITHUB_WORKSPACE/scripts/check_remote_mcp.py"