name: APM Marketplace Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  marketplace-check:
    name: Check APM marketplace packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check package Markdown hygiene
        run: python scripts/check_markdown_hygiene.py --root . --include packages

      - name: Install APM CLI
        run: python -m pip install --upgrade apm-cli

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Generate marketplace artifact
        run: apm pack

      - name: Check marketplace packages
        run: apm marketplace check

      - name: Test remote marketplace MCP servers
        env:
          MCP_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          MCP_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          apm marketplace add "https://github.com/${MCP_REPO}" \
            --name eclipse-score-apm-marketplace --ref "$MCP_REF"
          apm install context-discipline@eclipse-score-apm-marketplace \
            --target vscode --trust-transitive-mcp
          apm install sdlc-harness@eclipse-score-apm-marketplace \
            --target vscode --trust-transitive-mcp
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config_path = Path(".vscode/mcp.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          revision = os.environ["MCP_REF"]
          repository = os.environ["MCP_REPO"]
          for server in config["servers"].values():
              args = server.get("args", [])
              for index, argument in enumerate(args):
                  args[index] = re.sub(
                      r"^git\+https://github\.com/eclipse-score/mcp-servers(@[^#]+)?#",
                      f"git+https://github.com/eclipse-score/mcp-servers@{revision}#",
                      argument,
                  )
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          uv tool install 'graphifyy[mcp]==0.9.70'
          python "$GITHUB_WORKSPACE/scripts/check_remote_mcp.py"