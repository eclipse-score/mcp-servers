name: APM Marketplace Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - local_harness_apm
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  marketplace-check:
    name: Check APM marketplace packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install APM CLI
        run: python -m pip install --upgrade apm-cli

      - name: Generate marketplace artifact
        run: apm pack

      - name: Check marketplace packages
        run: apm marketplace check