name: On PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  score-pr-checks:
    name: S-CORE PR checks
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@8c48c65fc9e8927a06214192e6ebce520853087d

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check . --exclude '*.md'
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Validate overlay
        run: uv run python scripts/validate_overlay.py --base origin/${{ github.base_ref }}
