name: On PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  score-pr-checks:
    name: S-CORE PR checks
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@f77ed751fa587e3a1142b2d85320917e00c888ae

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check . --exclude '*.md'
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Check version pins
        run: uv run python scripts/check_pins.py
      - name: Dry-run release check
        # Non-blocking: warns if release would fail, but doesn't block the PR
        # Only blocks if this is a release PR (branch starts with bump- or release-)
        run: |
          if [[ "${{ github.head_ref }}" == bump-* || "${{ github.head_ref }}" == release-* ]]; then
            echo "Release PR detected - running mandatory release check"
            uv run python scripts/check_pins.py --release
          else
            echo "Non-release PR - running advisory release check (non-blocking)"
            uv run python scripts/check_pins.py --release || echo "::warning::Release check failed. This is OK for feature PRs, but must be fixed before release."
          fi
      - name: Validate overlay
        run: uv run python scripts/validate_overlay.py --base origin/${{ github.base_ref }}
