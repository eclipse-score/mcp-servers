name: On PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  score-pr-checks:
    name: S-CORE PR checks
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@34dd1d53c3f3291d0855dd8a5d43cfdaceb8f55a

  python-checks:
    name: Python checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The model gate runs all checks shared with the refresh workflow, plus
      # PR-context-only checks (the release dry run and the overlay delta budget).
      - name: Model gate
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: scripts/model_gate.sh
