name: On PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  score-pr-checks:
    name: S-CORE PR checks
    uses: eclipse-score/cicd-workflows/.github/workflows/on-pr.yml@4c70b38c9cb40c96ec63320190b9db9091648968

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check . --exclude '*.md'
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
      - name: Check version pins
        run: uv run python scripts/check_pins.py
      - name: Dry-run release check
        run: |
          version="$(uv run python scripts/prepare_release.py --plan | jq -r '.version')"
          uv run python scripts/prepare_release.py "$version"
          uv lock
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u
          git commit --allow-empty -m "Dry-run release metadata"
          uv run python scripts/check_pins.py --release
      - name: Validate overlay
        run: uv run python scripts/validate_overlay.py --base origin/${{ github.base_ref }}
