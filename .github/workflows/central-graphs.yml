name: Central code graphs

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/central-graphs.yml
      - scripts/graph_targets.py

permissions:
  contents: read

env:
  KNOWN_GOOD_URL: https://raw.githubusercontent.com/eclipse-score/reference_integration/main/known_good.json
  GRAPH_REPOSITORY: ghcr.io/eclipse-score/mcp-servers/graphs

jobs:
  targets:
    name: Select graph targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select targets from known_good.json
        id: select
        env:
          LIMIT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          curl -fsSL "$KNOWN_GOOD_URL" -o known_good.json
          echo "matrix=$(python scripts/graph_targets.py known_good.json --limit "$LIMIT")" >> "$GITHUB_OUTPUT"

  graph:
    name: Graph ${{ matrix.name }}
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      NAME: ${{ matrix.name }}
      REF: ${{ matrix.ref }}
    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eclipse-score/${{ matrix.name }}
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build code graph
        run: |
          uv tool install 'graphifyy[mcp]==0.9.53'
          (cd src && graphify extract . --code-only)
          mkdir out
          cp src/graphify-out/graph.json src/graphify-out/manifest.json out/
          needs_url="https://eclipse-score.github.io/${NAME}/main/needs.json"
          if curl -fsSL "$needs_url" -o out/needs.json; then
            needs_source="$needs_url"
          else
            rm -f out/needs.json
            needs_source=""
          fi
          python - "$needs_source" <<'PY'
          import json
          import os
          import sys
          from datetime import UTC, datetime

          metadata = {
              "schema": 1,
              "repository": f"eclipse-score/{os.environ['NAME']}",
              "commit": os.environ["REF"],
              "graphify": "0.9.53",
              "needs_source": sys.argv[1] or None,
              "built_at": datetime.now(UTC).isoformat(timespec="seconds"),
          }
          with open("out/metadata.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
          PY
          tar -czf graph.tar.gz -C out .
          sha256sum graph.tar.gz
          ls -l out graph.tar.gz

      - name: Install ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1

      - name: Push graph artifact
        id: push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(oras push "${GRAPH_REPOSITORY}/${NAME}:${REF},known-good" \
            --artifact-type application/vnd.eclipse-score.graph.v1 \
            --format go-template='{{.digest}}' \
            graph.tar.gz:application/vnd.eclipse-score.graph.v1.tar+gzip)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest graph artifact
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GRAPH_REPOSITORY }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
