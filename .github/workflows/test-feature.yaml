name: "Test agent-context Feature"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-feature-installation:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        baseImage:
          - "ubuntu:jammy"
          - "debian:12"
          - "mcr.microsoft.com/devcontainers/javascript-node:4-24"
        platform:
          - "linux/amd64"
          - "linux/arm64"
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test agent-context feature on ${{ matrix.baseImage }} (${{ matrix.platform }})"
        run: |
          devcontainer features test \
            --skip-scenarios \
            -f agent-context \
            -i ${{ matrix.baseImage }} \
            --platform ${{ matrix.platform }} \
            .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test agent-context scenarios"
        run: devcontainer features test -f agent-context --skip-autogenerated .

  consumer-test:
    """
    Consumer test: Validate the feature works in a real devcontainer
    This catches issues like our caching problem where the feature
    installation succeeds in isolation but fails in a real devcontainer.
    """
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Build test devcontainer with agent-context feature"
        run: |
          # Create a minimal devcontainer.json that uses the feature
          mkdir -p /tmp/test-devcontainer/.devcontainer
          cat > /tmp/test-devcontainer/.devcontainer/devcontainer.json << 'EOF'
          {
            "image": "mcr.microsoft.com/devcontainers/javascript-node:4-24",
            "features": {
              "./features/src/agent-context": {}
            }
          }
          EOF
          
          # Build the devcontainer
          cd /tmp/test-devcontainer
          devcontainer build --workspace-folder .

      - name: "Verify uv is installed and accessible"
        run: |
          # Test that uv was installed correctly and can be executed
          docker run --rm $(docker images -q | head -1) bash -c "uv --version && uv tool list"
