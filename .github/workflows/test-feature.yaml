name: "Test agent-context Feature"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVCONTAINER_CLI_VERSION: "0.88.0"

jobs:
  test-feature-installation:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        baseImage:
          - "ubuntu:jammy"
          - "debian:12"
          - "mcr.microsoft.com/devcontainers/javascript-node:4-24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Test agent-context installation
        env:
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          devcontainer features test \
            --project-folder features \
            --skip-scenarios \
            -f agent-context \
            -i "$BASE_IMAGE"

  test-scenarios:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Test agent-context scenarios
        run: devcontainer features test --project-folder features -f agent-context --skip-autogenerated

  consumer-test:
    name: Test feature in a consumer devcontainer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devcontainer CLI
        run: npm install -g "@devcontainers/cli@${DEVCONTAINER_CLI_VERSION}"

      - name: Start consumer devcontainer
        run: |
          workspace="${RUNNER_TEMP}/agent-context-consumer"
          echo "CONSUMER_WORKSPACE=${workspace}" >> "$GITHUB_ENV"
          mkdir -p "$workspace/.devcontainer/features"
          cp -R features/src/agent-context "$workspace/.devcontainer/features/"
          cp features/test/agent-context/test.sh "$workspace/test.sh"
          node - "$workspace" <<'JS'
          const fs = require('fs');
          const path = require('path');
          const config = {
            image: 'mcr.microsoft.com/devcontainers/javascript-node:4-24',
            remoteUser: 'node',
            features: { './features/agent-context': {} },
            postCreateCommand: 'touch "$HOME/.claude.json" && python3 /usr/local/share/agent-context/register_mcp.py',
          };
          fs.writeFileSync(path.join(process.argv[2], '.devcontainer/devcontainer.json'), JSON.stringify(config));
          JS
          devcontainer up --workspace-folder "$workspace"

      - name: Verify installed server and registration as remote user
        run: |
          devcontainer exec --workspace-folder "$CONSUMER_WORKSPACE" bash test.sh
          devcontainer exec --workspace-folder "$CONSUMER_WORKSPACE" \
            bash -euc 'uv --version; python3 -c '\''import json, os; from pathlib import Path; config = json.loads((Path.home() / ".claude.json").read_text()); command = config["mcpServers"]["score-codegraph"]["command"]; assert os.access(command, os.X_OK), command'\'''
      - name: Remove consumer container
        if: always()
        run: |
          if [[ -n "${CONSUMER_WORKSPACE:-}" ]]; then
            docker ps -aq --filter "label=devcontainer.local_folder=${CONSUMER_WORKSPACE}" | xargs -r docker rm -f
          fi
