[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "score-graphify-codegraph"
version = "0.1.0"
description = "MCP launcher for the Graphify code graph server"
requires-python = ">=3.11"
dependencies = ["graphifyy[mcp]==0.9.53"]

[project.scripts]
graphify-codegraph = "serve:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/serve.py"]
sources = ["src"]