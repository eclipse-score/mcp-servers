name: graphify-codegraph
version: 0.1.0
description: |
  MCP server + guidance for deterministic code graph queries.
  Wraps external Graphify Labs graphify for AST-based repository mapping.
  Provides skills for repository navigation and symbol discovery.
  Used by context-discipline working memory for code structure queries.
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../apm-setup
  mcp:
    - name: apm-setup
      registry: false
      transport: stdio
      command: python3
      args:
        - apm_modules/eclipse-score/mcp-servers/packages/apm-setup/src/apm_setup/serve.py
