name: graphify-codegraph
version: 0.2.3
description: |
  MCP server + guidance for deterministic code graph queries.
  Wraps external Graphify Labs graphify for AST-based repository mapping.
  Provides skills for repository navigation and symbol discovery.
  Used by context-discipline working memory for code structure queries.
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../apm-setup
  mcp:
    - name: graphify-codegraph
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@9c88f0201277adecec8979505c28e9baf688b4a4#subdirectory=packages/graphify-codegraph # v0.2.3
        - graphify-codegraph
