name: graphify-codegraph
version: 0.2.8
description: |
  MCP server + guidance for deterministic code graph queries.
  Wraps external Graphify Labs graphify for AST-based repository mapping.
  Provides skills for repository navigation and symbol discovery.
  Used by context-discipline working memory for code structure queries.
license: Apache-2.0
targets:
  - agent-skills
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../apm-setup
  mcp:
    - name: graphify-codegraph
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@0df389d81bf6e4c0d4f532513312edfe8fb4edab#subdirectory=packages/graphify-codegraph # v0.2.8
        - graphify-codegraph
