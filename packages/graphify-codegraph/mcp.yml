name: graphify-codegraph
version: 0.2.2
description: MCP server wrapping external graphify CLI for code graph queries
command: uvx
args:
  - --from
  - git+https://github.com/eclipse-score/mcp-servers@ff680231d1fbdd3f0011263d8836c135f4d5c57b#subdirectory=packages/graphify-codegraph # v0.2.2
  - graphify-codegraph
external_dependency:
  tool: graphify
  install: uv tool install 'graphifyy[mcp]==0.9.97'
  docs: https://github.com/Graphify-Labs/graphify
