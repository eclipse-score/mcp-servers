name: graphify-codegraph
version: 0.2.3
description: MCP server wrapping external graphify CLI for code graph queries
command: uvx
args:
  - --from
  - git+https://github.com/eclipse-score/mcp-servers@cd80b53ced4035ae77105e1939ee4c9dec3c8d5e#subdirectory=packages/graphify-codegraph # v0.2.3
  - graphify-codegraph
external_dependency:
  tool: graphify
  install: uv tool install 'graphifyy[mcp]==0.9.97'
  docs: https://github.com/Graphify-Labs/graphify
