[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "score-sdlc-harness"
version = "0.1.0"
description = "Traceable SDLC lifecycle and Sphinx-needs MCP server"
requires-python = ">=3.11"

[project.scripts]
sdlc-harness = "sdlc_harness.serve:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]