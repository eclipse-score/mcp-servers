name: sdlc-harness
version: 0.2.3
description: SDLC lifecycle guidance and implementation evidence for AI agents in Eclipse S-CORE.
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../context-discipline
    - path: ../graphify-codegraph
  mcp:
    - name: sdlc-harness
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@9c88f0201277adecec8979505c28e9baf688b4a4#subdirectory=packages/sdlc-harness # v0.2.3
        - sdlc-harness