name: context-discipline
version: 0.1.0
description: Working memory management and local learning orchestration. Integrates graphify (external) for code structure queries.
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../apm-setup
  mcp:
    - name: apm-setup
      registry: false
      transport: stdio
      command: python3
      args:
        - apm_modules/_local/apm-setup/src/apm_setup/serve.py
