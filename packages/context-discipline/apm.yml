name: context-discipline
version: 0.2.3
description: Working memory management and local learning orchestration. Integrates graphify (external) for code structure queries.
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm:
    - path: ../apm-setup
    - path: ../graphify-codegraph
  mcp:
    - name: context-discipline
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@ec52b052dee02eb3e8a8a130f78eaa815042bacc#subdirectory=packages/context-discipline # v0.2.3
        - context-discipline
