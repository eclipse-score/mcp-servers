[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "score-apm-setup"
version = "0.1.0"
description = "Local setup MCP server for Eclipse S-CORE APM packages"
requires-python = ">=3.11"

[project.scripts]
apm-setup = "apm_setup.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apm_setup"]
