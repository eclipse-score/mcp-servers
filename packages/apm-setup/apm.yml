name: apm-setup
version: 0.2.11
description: Local setup MCP server for Eclipse S-CORE APM packages
license: Apache-2.0
targets:
  - agent-skills
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm: []
  mcp:
    - name: apm-setup
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@4091cf4fa9bb57133fe5e0f8a940668158e348ab#subdirectory=packages/apm-setup # v0.2.11
        - apm-setup
