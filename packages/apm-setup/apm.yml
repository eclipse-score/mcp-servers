name: apm-setup
version: 0.1.0
description: Local setup MCP server for Eclipse S-CORE APM packages
license: Apache-2.0
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm: []
  mcp:
    - name: apm-setup
      registry: false
      transport: stdio
      command: python3
      args:
        - apm_modules/apm-setup/src/apm_setup/serve.py
