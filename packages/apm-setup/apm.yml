name: apm-setup
version: 0.2.3
description: Local setup MCP server for Eclipse S-CORE APM packages
license: Apache-2.0
targets:
  - agent-skills
  - copilot
  - claude
  - cursor
  - codex
  - gemini
  - opencode
dependencies:
  apm: []
  mcp:
    - name: apm-setup
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - git+https://github.com/eclipse-score/mcp-servers@ff5758419353d04d93a695001e5f7f13637db861#subdirectory=packages/apm-setup # v0.2.7
        - apm-setup
